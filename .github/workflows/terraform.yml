name: terraform

# This repo is applied by admins from their machines. CI only checks and plans.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 0 * * 1" # Weekly drift check, Mondays 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    uses: maison-douce-bakery/platform-ci-workflows/.github/workflows/terraform-static.yml@6fb526a6f532e08a00fc4131ecad00042e83c690 # terraform-static/v1.0.0
    with:
      directories: bootstrap account-baseline iam-baseline ci-access audit registry

  plan:
    needs: terraform
    uses: maison-douce-bakery/platform-ci-workflows/.github/workflows/terraform-plan.yml@14a60ad81ce2b6807c47ecc032dd9deb6c252161 # terraform-plan/v1.0.0
    with:
      stacks: '["bootstrap", "account-baseline", "iam-baseline", "ci-access", "audit", "registry"]'
      role_arn: ${{ vars.AWS_CI_PLAN_ROLE_ARN }}
      aws_region: ${{ vars.AWS_REGION }}
    secrets:
      aws_access_key_id: ${{ secrets.AWS_CI_PLAN_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.AWS_CI_PLAN_SECRET_ACCESS_KEY }}
      tf_vars: alert_emails=${{ secrets.ALERT_EMAILS }}
